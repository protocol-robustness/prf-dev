name: verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  portable-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: tools/verify-publication .
      - run: python -m compileall -q src tests
